# Iosevka Heiskr — custom build (single Semi-Expanded width)
# The Semi-Expanded advance (548 font units, 112.5% of Iosevka's Normal) is the
# one true width here. It occupies the Normal width slot (menu 5, css "normal")
# so the family name stays plain "Iosevka Heiskr" with no width suffix, and no
# app config change is needed. The OS/2 usWidthClass therefore reports
# 5 (Normal) even though the glyphs are physically semi-expanded, which is
# irrelevant for a single-width personal build.
#
# Aesthetic: humanist, single-storey, serifless. Rounded and open rather than
# geometric. Every letterform is pinned in `variants` and OpenType cv/ss feature
# export is disabled (noCvSs), so the shapes are locked and never shift between
# apps regardless of their font-feature settings.

[buildPlans.IosevkaHeiskr]
family = "Iosevka Heiskr"
spacing = "normal"          # proportional-aware widths + wide arrows/symbols
serifs = "sans"
noCvSs = true               # don't export cv/ss features; shapes below are the only truth
exportGlyphNames = false

# --- Width: single Semi-Expanded width, sitting in the Normal slot ---
# shape = advance width in font units. 548 is Iosevka's Semi-Expanded step
# (500 * ~1.096). menu = 5 and css = "normal" keep it in the unsuffixed Normal
# slot so the family name stays "Iosevka Heiskr".
[buildPlans.IosevkaHeiskr.widths.Normal]
shape = 548
menu = 5
css = "normal"

[buildPlans.IosevkaHeiskr.variants.design]
# --- Digits: tuned for terminal legibility ---
zero = "slashed"                    # 0 vs O disambiguation. Alt I like: "dotted"
two = "straight-neck-serifless"
four = "closed-non-crossing-serifless"
five = "upright-flat-serifless"
six = "closed-contour"              # closed bowls on 6/9 read cleaner at small sizes
eight = "two-circles"
nine = "closed-contour"
# capital-i is left at its default ("serifed", long top+bottom serifs), which
# completes the 1 / I / l / i disambiguation set alongside the tailed i and l below.

# --- Letters: single-storey humanist core ---
a = "single-storey-serifless"       # single-storey a...
g = "single-storey-flat-hook-serifless"   # ...paired with single-storey g for a rounded, open feel
u = "toothless-rounded-serifless"
y = "cursive-flat-hook-serifless"
f = "flat-hook-serifless"
t = "flat-hook"
r = "serifless"
i = "serifed-flat-tailed"           # serifed + tailed: separates i / l / 1 / I
l = "serifed-flat-tailed"
j = "flat-hook-serifless"
capital-g = "toothless-rounded-serifless-hooked"
capital-j = "serifless"
capital-q = "straight"              # straight tail keeps Q distinct from O/0

# --- Symbols: hand-tuned punctuation ---
paren = "flat-arc"
guillemet = "straight"
percent = "rings-continuous-slash"
lig-ltgteq = "slanted"              # slanted <= >=

[buildPlans.IosevkaHeiskr.variants.italic]
# Italic inherits the design shapes above and overrides only where a true cursive
# form reads better in slanted text. Diagonal tails give a cursive feel without
# going fully traditional.
a = "single-storey-tailed"
f = "flat-hook-tailed"
u = "tailed-serifless"
k = "diagonal-tailed-cursive-serifless"   # cursive loop plus diagonal tail; without serifs
t = "diagonal-tailed-short-neck"
i = "serifed-diagonal-tailed"
l = "serifed-diagonal-tailed"

[buildPlans.IosevkaHeiskr.weights.Thin]
shape = 100
menu = 100
css = 100

[buildPlans.IosevkaHeiskr.weights.ExtraLight]
shape = 200
menu = 200
css = 200

[buildPlans.IosevkaHeiskr.weights.Light]
shape = 300
menu = 300
css = 300

[buildPlans.IosevkaHeiskr.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaHeiskr.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.IosevkaHeiskr.weights.SemiBold]
shape = 600
menu = 600
css = 600

[buildPlans.IosevkaHeiskr.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.IosevkaHeiskr.weights.ExtraBold]
shape = 800
menu = 800
css = 800

[buildPlans.IosevkaHeiskr.weights.Heavy]
shape = 900
menu = 900
css = 900

[buildPlans.IosevkaHeiskr.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaHeiskr.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"


# Terminal build: identical letterforms + same 548 width, but `term`
# spacing narrows arrows and geometric symbols to a single cell so they stop
# overlapping in the terminal's rigid grid. Inherits every variant/weight/slope/
# width from the plan above, so the two builds can never drift out of sync.
[buildPlans.IosevkaHeiskrTerm]
family = "Iosevka Heiskr Term"
spacing = "term"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

[buildPlans.IosevkaHeiskrTerm.widths]
inherits = "buildPlans.IosevkaHeiskr"

[buildPlans.IosevkaHeiskrTerm.variants]
inherits = "buildPlans.IosevkaHeiskr"

[buildPlans.IosevkaHeiskrTerm.weights]
inherits = "buildPlans.IosevkaHeiskr"

[buildPlans.IosevkaHeiskrTerm.slopes]
inherits = "buildPlans.IosevkaHeiskr"
